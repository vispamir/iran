server {
    listen 80;
    listen [::]:80;
    server_name iranunfolded.com www.iranunfolded.com;
    return 301 https://iranunfolded.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.iranunfolded.com;
    ssl_certificate /etc/nginx/ssl/iranunfolded/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/iranunfolded/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://iranunfolded.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iranunfolded.com;
    ssl_certificate /etc/nginx/ssl/iranunfolded/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/iranunfolded/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
